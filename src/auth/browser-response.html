<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>{{title}} · nunu cli</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a0a1c;
        color: #fff;
        font-family: "Geist Mono", Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        width: 100%;
        max-width: 720px;
        padding: 80px 0;
        text-align: center;
      }
      .status { width: 72px; height: 72px; color: #22c55e; }
      .error .status { color: #ff5630; }
      h1 { margin: 0; font-size: clamp(36px, 8vw, 60px); font-weight: 600; line-height: 1.3; }
      p { margin: 0; max-width: 592px; color: #919199; font-size: clamp(18px, 4vw, 24px); line-height: 1.7; }
    </style>
  </head>
  <body class="{{state}}">
    <main aria-labelledby="title">
      <svg class="status" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="11" fill="currentColor"/>
        <path d="{{symbol}}" fill="none" stroke="#0a0a1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 id="title">{{title}}</h1>
      <p>you can close this tab and return to your terminal.</p>
    </main>
  </body>
</html>
